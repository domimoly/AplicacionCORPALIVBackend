spring.application.name=ms-admin
server.port=9093

# Base de datos MySQL (se crea sola si no existe). Cambia usuario y clave si tu MySQL tiene otros
spring.datasource.url=jdbc:mysql://localhost:3306/bd_admin?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# update: crea o ajusta las tablas según las clases @Entity, sin borrar los datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clave con la que se FIRMAN los tokens JWT (este servicio es el único que los crea).
# DEBE ser la misma en ms-admin, ms-contenidos, ms-catalogo y ms-vinculacion.
# Si existe la variable de entorno SECRET se usa esa; si no, el valor que está después de los dos puntos
jwt.secret=${SECRET:corpaliv_clave_secreta_jwt_proyecto_2026}
# Cuántas horas dura un token antes de expirar
jwt.expiracion-horas=8

# Swagger (documentación): http://localhost:9093/doc/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
