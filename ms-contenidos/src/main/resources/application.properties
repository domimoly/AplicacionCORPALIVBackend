spring.application.name=ms-contenidos
server.port=9091

# Base de datos MySQL (se crea sola si no existe). Cambia usuario y clave si tu MySQL tiene otros
spring.datasource.url=jdbc:mysql://localhost:3306/bd_contenidos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# update: crea o ajusta las tablas según las clases @Entity, sin borrar los datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clave con la que se firman los tokens JWT. DEBE ser la misma en ms-admin, ms-contenidos, ms-catalogo y ms-vinculacion.
# Si existe la variable de entorno SECRET se usa esa; si no, el valor que está después de los dos puntos
jwt.secret=${SECRET:corpaliv_clave_secreta_jwt_proyecto_2026}

# Swagger (documentación): http://localhost:9091/doc/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
